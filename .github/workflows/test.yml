name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Host half
        run: node tests/state.test.mjs
      - name: Browser half
        run: node tests/client.test.mjs
